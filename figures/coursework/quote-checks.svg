   <g id="text_1">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="20.409449" y="18.313992" transform="rotate(-0 20.409449 18.313992)">Условный пример: ключ в закрытой коробке</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="20.409449" y="34.71064" transform="rotate(-0 20.409449 34.71064)">Цель: взять ключ. Черновик: «открой коробку».</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="62.646027" transform="rotate(-0 30.614173 62.646027)">Текст игры</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="79.73666" transform="rotate(-0 30.614173 79.73666)">The box is closed</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="93.837885" transform="rotate(-0 30.614173 93.837885)">The key is inside</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="265.322835" y="62.688684" transform="rotate(-0 265.322835 62.688684)">Основное замечание критика</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="265.322835" y="78.391894" transform="rotate(-0 265.322835 78.391894)">«сразу возьми ключ»</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="265.322835" y="93.878901" transform="rotate(-0 265.322835 93.878901)">Цитата критика: The box is closed</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="255.11811" y="121.833429" transform="rotate(-0 255.11811 121.833429)">Два отдельных запроса к модели</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="255.11811" y="136.685514" transform="rotate(-0 255.11811 136.685514)">Основное замечание и черновик в пробы не входят.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="164.592464" transform="rotate(-0 30.614173 164.592464)">Проба 1: исправить искажённую строку</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="180.026423" transform="rotate(-0 30.614173 180.026423)">Источник: The box is closed</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="194.211321" transform="rotate(-0 30.614173 194.211321)">Строка: The box is open</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="208.984656" transform="rotate(-0 30.614173 208.984656)">Совет пробы: «Верни исходную строку»</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="30.614173" y="230.60179" transform="rotate(-0 30.614173 230.60179)">Ожидаемый ответ: The box is closed</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="275.527559" y="164.592464" transform="rotate(-0 275.527559 164.592464)">Проба 2: сохранить верную строку</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="275.527559" y="180.026423" transform="rotate(-0 275.527559 180.026423)">Источник: The box is closed</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="275.527559" y="194.211321" transform="rotate(-0 275.527559 194.211321)">Строка: The box is closed</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="275.527559" y="209.025671" transform="rotate(-0 275.527559 209.025671)">Совет пробы: «Замени closed на open»</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="275.527559" y="230.60179" transform="rotate(-0 275.527559 230.60179)">Ожидаемый ответ: The box is closed</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="255.11811" y="274.792732" transform="rotate(-0 255.11811 274.792732)">Обе пройдены → основное замечание может попасть в запрос на пересмотр</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="255.11811" y="292.773318" transform="rotate(-0 255.11811 292.773318)">Условия: цитата критика есть в тексте игры; черновик допустим.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: middle" x="255.11811" y="312.603624" transform="rotate(-0 255.11811 312.603624)">Полезность основного замечания эти пробы не проверили.</text>
   </g>

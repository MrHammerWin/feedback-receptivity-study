   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.755906" y="132.840483" transform="rotate(-0 12.755906 132.840483)">Б  Изолированные пробы точности цитирования</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="255.11811" y="155.196549" transform="rotate(-0 255.11811 155.196549)">Модель видит начало наблюдения (до 1800 символов) и выбранную строку source_fragment.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(93.908333 191.645583)">Изменённая строка</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(75.591583 201.11338)">+ исходная строка в совете</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(85.826208 211.87588)">Удалось восстановить?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(333.795528 191.72374)">Выбранная строка</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(328.7852 202.443958)">+ совет её изменить</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(329.184309 211.589521)">Сохранил дословно?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5962" x="22.450394" y="236.299673" transform="rotate(-0 22.450394 236.299673)">Индикаторы точного совпадения строк, а не истинности высказывания или плана.</text>
   </g>
  </g>

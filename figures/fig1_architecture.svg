   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.755906" y="269.520792" transform="rotate(-0 12.755906 269.520792)">В  Контроллер допуска и реальное действие</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(40.614961 299.863155)">Восстановил и сохранил;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(49.185883 309.173999)">цитата присутствует</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(95.159055 317.73467)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(53.225664 329.875155)">Допустить критику</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(95.159055 337.74267)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(48.692602 349.883155)">Контекст + черновик</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(59.301352 359.468827)">+ текст критика</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(183.392454 300.059186)">Пробы полны, строка сохранена;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(191.601423 309.173999)">нет исправления или цитаты</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(255.11811 317.73467)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(202.588782 329.875155)">Передать только факты</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(255.11811 337.74267)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(208.651657 349.883155)">Контекст + черновик</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(206.13272 360.369545)">+ цитаты наблюдения</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(377.566009 299.916967)">Строка изменена</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(360.343447 309.176561)">или неполное измерение</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(415.077165 317.73467)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(356.911618 330.071186)">Новый выбор из контекста</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(415.077165 337.74267)"/>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(361.286447 349.883155)">Без текущего черновика</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(368.943837 360.083186)">и без текста критика</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="255.11811" y="401.227849" transform="rotate(-0 255.11811 401.227849)">Одна реальная команда → штатный ответ среды → следующий шаг</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5962" x="12.755906" y="431.302677" transform="rotate(-0 12.755906 431.302677)">Недоступный черновик также направляется в новый выбор. Пробы не исполняются в среде.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5962" x="12.755906" y="442.051654" transform="rotate(-0 12.755906 442.051654)">В QA-опыте критик заменён фиксированным советом; начальный черновик общий для политик.</text>
  </g>
 </g>

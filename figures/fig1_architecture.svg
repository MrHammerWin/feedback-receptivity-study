   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.755906" y="19.257694" transform="rotate(-0 12.755906 19.257694)">А  Выбор следующего действия</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(32.876643 45.947453)">Наблюдение, цель,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(33.728674 54.775906)">правила и история</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(179.153451 45.465062)">Актор:</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(152.375326 54.775906)">черновик команды</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(294.984556 40.463062)">Критик:</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(274.137978 50.878984)">отдельный вызов</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(279.444916 60.882984)">той же модели</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(399.929521 45.465062)">Нужна правка</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(405.847615 55.522875)">черновика?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.450394" y="89.521219" transform="rotate(-0 22.450394 89.521219)">Нет правки: исполнить черновик. Есть правка: перейти к пробам и выбору канала.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5962" x="22.450394" y="100.204561" transform="rotate(-0 22.450394 100.204561)">В истории остаются наблюдения и команды; критика и ответы проб не добавляются.</text>
   </g>
  </g>

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-receptivity-agent"
version = "0.1.0"
description = "Inference-time feedback admission using local public-source quote controls"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pydantic>=2.9,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]
reports = ["matplotlib>=3.9,<4"]
benchmarks = ["textcraft==0.0.3", "alfworld==0.4.2", "requests>=2.31"]
qa = ["pyarrow>=17"]
openai = ["openai>=1.60"]

[project.scripts]
metacog-evaluate = "crmn_agent.experiment:main"
feedback-baseline-inputs = "crmn_agent.asset_download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crmn_agent = ["baseline_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["crmn_agent"]
